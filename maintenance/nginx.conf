# Every request is a 503: the page for browsers, the API's error shape for clients.
server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  add_header Cache-Control "no-store" always;
  add_header Retry-After "3600" always;

  location = /index.html {
    internal;
  }

  location /api/ {
    default_type application/json;
    return 503 '{"error":{"code":"maintenance","message":"Trading has been paused, acceptodds will be back soon."}}';
  }

  location / {
    error_page 503 /index.html;
    return 503;
  }
}
